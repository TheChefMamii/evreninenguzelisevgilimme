<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İçimi Döküyorum</title>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }    
        body {
            margin: 0;
            padding: 0;
            color: #d1d1d1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: #050505; 
            overflow: hidden; 
        }

        .video-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
            pointer-events: none; 
        }

        .video-wrapper iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw; 
            min-height: 100vh;
            min-width: 177.77vh; 
            transform: translate(-50%, -50%) scale(1.3); 
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .video-wrapper iframe {
                transform: translate(-25%, -50%) scale(1.3); 
            }
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75); 
            z-index: 0;
        }

        .eski-ani {
            position: absolute;
            top: 20px;
            left: 20px;
            text-align: left;
            font-size: 0.8rem;
            color: #ffffff;
            opacity: 0.4; 
            z-index: 2;
            pointer-events: none;
            line-height: 1.4;
            font-style: italic;
        }
        
        .eski-ani-derece {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 3px;
            display: block;
        }

        #sayac-kapsayici {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            z-index: 2;
            pointer-events: none;
        }
        
        .eski-baslik {
            font-size: 0.75rem;
            color: #777;
            text-decoration: line-through;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        
        #sayac {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #ffffff;
            line-height: 1.3;
        }

        .container {
            position: relative;
            z-index: 1; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 35px 20px;
            border-radius: 12px;
            background-color: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(8px); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            width: 85%;
            max-width: 450px; 
            transition: opacity 0.5s ease;
        }
        
        h1 {
            font-size: 1.3rem;
            color: #ff4c4c;
            margin-bottom: 15px;
            font-weight: normal;
            letter-spacing: 1px;
            margin-top: 0;
        }
        
        .duygusal-yazi {
            font-size: 0.9rem;
            color: #888;
            margin-top: 20px;
            margin-bottom: 25px;
            font-style: italic;
            line-height: 1.5;
        }

        .btn-secim {
            padding: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            border: 1px solid rgba(255, 76, 76, 0.4);
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            font-size: 1rem;
            text-decoration: none; 
            width: 100%;
            display: block;
            box-sizing: border-box;
        }

        .btn-secim:hover {
            background: rgba(255, 76, 76, 0.15);
            border-color: #ff4c4c;
        }

        .gizli {
            display: none !important;
        }

        /* Yeni Ekran Stilleri */
        #mesaj-ekrani {
            max-height: 75vh;
            overflow-y: auto;
            padding: 25px 20px;
            text-align: left;
        }

        /* Scrollbar tasarımı */
        #mesaj-ekrani::-webkit-scrollbar {
            width: 6px;
        }
        #mesaj-ekrani::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        #mesaj-ekrani::-webkit-scrollbar-thumb {
            background: rgba(255, 76, 76, 0.4);
            border-radius: 10px;
        }
        
        .mesaj-kart {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid #ff4c4c;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 0 6px 6px 0;
        }

        .mesaj-kart:last-child {
            margin-bottom: 0;
        }

        .mesaj-metin {
            font-size: 0.95rem;
            color: #ddd;
            line-height: 1.6;
            white-space: pre-wrap; 
        }

    </style>
</head>
<body>

<audio id="bg-muzik" loop>
    <source src="muzik.mp3" type="audio/mpeg">
</audio>

<div class="video-wrapper">
    <iframe src="https://www.youtube.com/embed/qk_aNQJG_g8?autoplay=1&mute=1&loop=1&playlist=qk_aNQJG_g8&controls=0&showinfo=0&autohide=1&rel=0&modestbranding=1" 
            frameborder="0" 
            allow="autoplay; encrypted-media" 
            allowfullscreen>
    </iframe>
</div>

<div class="overlay"></div>

<div class="eski-ani">
    <span class="eski-ani-derece">❄️ 0°C</span>
    sen gittiğinden beri...
</div>

<div id="sayac-kapsayici">
    <div class="eski-baslik">sonsuzluğa akan sayaç...</div>
    <div id="sayac">Yükleniyor...</div>
</div>

<div class="container" id="baslangic-ekrani">
    <h1>İçimi Döküyorum...</h1>
    
    <p class="duygusal-yazi">Sadece içimden geçenleri buraya bırakıyorum.<br>Okumak istersen, buradayım.</p>
    
    <button id="btn-ileri" class="btn-secim">Okumaya Başla</button>
</div>

<!-- Mesajların akacağı ekran -->
<div class="container gizli" id="mesaj-ekrani">
    <div id="mesaj-icerik">
        <!-- JS ile mesajlar buraya eklenecek -->
    </div>
</div>

<script>
    // Sayaç Mantığı
    const ayrilikTarihi = new Date(2026, 7, 16, 11, 30, 0).getTime();

    setInterval(function() {
        const suAn = new Date().getTime();
        const fark = suAn - ayrilikTarihi;

        if (fark < 0) {
            document.getElementById("sayac").innerHTML = "0 Gün<br><span style='font-size: 0.9rem; color: #bbb;'>0 Saat 0 Dk 0 Sn</span>";
            return;
        }

        const gun = Math.floor(fark / (1000 * 60 * 60 * 24));
        const saat = Math.floor((fark % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const dakika = Math.floor((fark % (1000 * 60 * 60)) / (1000 * 60));
        const saniye = Math.floor((fark % (1000 * 60)) / 1000);

        document.getElementById("sayac").innerHTML = gun + " Gün<br><span style='font-size: 0.9rem; color: #bbb;'>" + saat + " Saat " + dakika + " Dk " + saniye + " Sn</span>";
    }, 1000);


    // MESAJLAR
    // Yeni bir mesaj bloğu eklemek için süslü parantezli yapıyı kopyalayıp virgülle ayırarak aşağıya yapıştır
    const yazilar = [
        {
            metin: "Bugün belki bi nebze kafa dağıtırım diye halısahaya gittim\n\nOlmuyomuş sen iyi maçlar yazmadan\n\n otistik gibi davranır milleti güldürürsem belki bi nebze düzelirim dedim\n\neve geldim hoşgeldin mesajı olmadıkça olmuyomuş\n\nbugün birde annem bi işi yapmayınca kız arkadaşın istese yapardın dedi\n\nhiçbirşey diyemedim\n\nkeşke herşeyi düzeltebilsem\n\nen azından buraya içimi dökebiliyorum\n\n yarın sabah yine erken uyancam fakat uyuyabilirmiyim bilmiyorum\n\nyeni şeyler oldu neler neler yaşadım hiçbirini sana anlatamadıkça hepsi bir hiç geldi\n\n bir şeyi bir projeyi kendi başıma yapabildim ama sana anlatmadım anlatamadım\n\n keşke yazabilsem çok isterdim\n\n sanki dükkanları mağazalarıda değiştirdiler her yerde o güzel adını görüyorum atölyemde iş yapamıyorum\n\n hala o N I yazısı duruyo hatta misafirler varken onu açtırdılar çok canım yandı\n\nkaç defa onu izopropil alkolle silmeyi düşündüm ama içmeyi tercih ederim onu yapacağıma\n\nhiçbir şeyi değiştiremiyorum...\n\n çok kızardım ben kötü birimiyim dersen bir daha\n\nhayatımı o kadar güzelleştirdinki\n\ntüm herşeyi sana göre şekillendirmiştim\n\nlütfen kendine böyle deme hayatımda gördüğüm en mükemmel kızsın\n\nve öylede kalıcaksın"
        },
    ];

    const baslangicEkrani = document.getElementById('baslangic-ekrani');
    const mesajEkrani = document.getElementById('mesaj-ekrani');
    const mesajIcerik = document.getElementById('mesaj-icerik');

    // Mesajları ekrana basan fonksiyon
    function mesajlariYukle() {
        let htmlContent = '';
        yazilar.forEach(yazi => {
            htmlContent += `
                <div class="mesaj-kart">
                    <div class="mesaj-metin">${yazi.metin}</div>
                </div>
            `;
        });
        mesajIcerik.innerHTML = htmlContent;
    }

    // Butona tıklanınca
    document.getElementById('btn-ileri').addEventListener('click', function() {
        baslangicEkrani.classList.add('gizli'); 
        mesajEkrani.classList.remove('gizli'); 
        
        mesajlariYukle(); 

        let muzik = document.getElementById('bg-muzik');
        if (muzik) {
            muzik.volume = 0.05; 
            muzik.play().catch(e => console.log("Otomatik oynatma engellendi."));
        }
    });

</script>

</body>
</html>

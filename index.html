<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süre Doldu</title>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            color: #d1d1d1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: #050505; 
            overflow: hidden; 
        }

        .video-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
            pointer-events: none; 
        }

        .video-wrapper iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw; 
            min-height: 100vh;
            min-width: 177.77vh; 
            transform: translate(-50%, -50%) scale(1.3); 
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .video-wrapper iframe {
                transform: translate(-25%, -50%) scale(1.3); 
            }
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75); 
            z-index: 0;
        }

        .eski-ani {
            position: absolute;
            top: 20px;
            left: 20px;
            text-align: left;
            font-size: 0.8rem;
            color: #ffffff;
            opacity: 0.4; 
            z-index: 2;
            pointer-events: none;
            line-height: 1.4;
            font-style: italic;
        }
        
        .eski-ani-derece {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 3px;
            display: block;
        }

        #sayac-kapsayici {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            z-index: 2;
            pointer-events: none;
        }
        
        .eski-baslik {
            font-size: 0.75rem;
            color: #777;
            text-decoration: line-through;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        
        #sayac {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #ffffff;
            line-height: 1.3;
        }

        .container {
            position: relative;
            z-index: 1; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 35px 20px;
            border-radius: 12px;
            background-color: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(8px); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            width: 85%;
            max-width: 380px; 
            transition: opacity 0.5s ease;
        }
        
        h1 {
            font-size: 1.3rem;
            color: #ff4c4c;
            margin-bottom: 15px;
            font-weight: normal;
            letter-spacing: 1px;
            margin-top: 0;
        }
        
        .duygusal-yazi {
            font-size: 0.85rem;
            color: #888;
            margin-top: 20px;
            margin-bottom: 25px;
            font-style: italic;
            line-height: 1.5;
        }

        .butonlar {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-secim {
            padding: 10px;
            background: rgba(255,255,255,0.03);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            font-size: 0.9rem;
            text-decoration: none; 
        }

        .btn-secim:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .btn-karanlik {
            border-color: rgba(255, 76, 76, 0.3);
            color: #a55;
        }

        .btn-karanlik:hover {
            background: rgba(255, 76, 76, 0.1);
            color: #ff4c4c;
        }

        .gizli {
            display: none !important;
        }

        #okuma-ekrani {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer; 
            padding: 20px;
            box-sizing: border-box;
        }

        #metin-alani {
            font-size: 1.2rem;
            color: #fff;
            line-height: 1.6;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            max-width: 600px;
            transition: opacity 0.5s ease;
        }

        .dokun-uyari {
            position: absolute;
            bottom: 40px;
            font-size: 0.75rem;
            color: #666;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        #final-ekrani {
            margin-top: 30px;
            width: 100%;
            max-width: 400px;
            animation: fadeIn 1s ease-in;
            z-index: 10;
        }

        .btn-whatsapp-dev {
            display: block;
            margin-bottom: 15px;
            padding: 20px;
            background: rgba(255, 76, 76, 0.08);
            border: 1px solid #ff4c4c;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.95rem;
            line-height: 1.5;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 76, 76, 0.1);
        }

        .btn-whatsapp-dev:hover {
            background: rgba(255, 76, 76, 0.2);
            transform: translateY(-2px);
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <audio id="bg-muzik" loop>
        <source src="muzik.mp3" type="audio/mpeg">
    </audio>

    <div class="video-wrapper">
        <iframe src="https://www.youtube.com/embed/qk_aNQJG_g8?autoplay=1&mute=1&loop=1&playlist=qk_aNQJG_g8&controls=0&showinfo=0&autohide=1&rel=0&modestbranding=1" 
                frameborder="0" 
                allow="autoplay; encrypted-media" 
                allowfullscreen>
        </iframe>
    </div>
    
    <div class="overlay"></div>

    <div class="eski-ani">
        <span class="eski-ani-derece">❄️ 0°C</span>
        sen gittiğinden beri...
    </div>

    <div id="sayac-kapsayici">
        <div class="eski-baslik">sonsuzluğa akan sayaç...</div>
        <div id="sayac">Yükleniyor...</div>
    </div>

    <div class="container" id="baslangic-ekrani">
        <h1>Prensesinden Ayrı Düşeli...</h1>

        <div class="butonlar">
            <button id="btn-ileri" class="btn-secim">Okumak İstiyorum</button>
            <button id="btn-cik" class="btn-secim btn-karanlik">Sadece Çık</button>
        </div>
    </div>

    <div id="okuma-ekrani" class="gizli">
        <p id="metin-alani"></p>
        
        <div id="final-ekrani" class="gizli">
            <a href="https://wa.me/905518780853" class="btn-whatsapp-dev">
                Bana istediğini yaz...
            </a>
            
            <button id="btn-final-cik" class="btn-secim btn-karanlik" style="width: 100%;">
                Şu an hazır değilim
            </button>
        </div>

        <div class="dokun-uyari">(Devam etmek için ekrana dokun)</div>
    </div>

            const suAn = new Date().getTime();

            if (fark < 0) {
                document.getElementById("sayac").innerHTML = "0 Gün<br><span style='font-size: 0.9rem; color: #bbb;'>0 Saat 0 Dk 0 Sn</span>";
                return;

            const dakika = Math.floor((fark % (1000 * 60 * 60)) / (1000 * 60));
            const saniye = Math.floor((fark % (1000 * 60)) / 1000);

            "sen bana hayat verdin ben senin hayatini bezdirdim ozur dilerim",

            "kendini ne yaparsan yap unutturamazsın bu saatten sonra ya sen ya hiç",

            "hani tilkiler hayatinda 1 eşe bağlanır ya",

            "sonsuza kadar bağlı kalacağım her ne olsa olsun",
            "ben suana kadar hicbir kimseye ne bu kadar baglandjm ne hicbir kişiden bu kadar sevgi görmedim nede besledim hiçbirşeyime inanma ama lütfen bunu bil",

            "gel dilimi kopar parçala keşke öyle yapsaydinda bu 2 şeye sebep olmasaydim",
            "seni çok seviyorum",
            "daha fazla yazmak isterdim ama boğmak istemiyorum seni",
            "değersiz hissettirmişsemde çok özür dilerim ama",
            "izin verirsen bana gerj gelirsen seni herşeyden değerli olduğunu geri hissettirmek isterim",
            "bu siteyi sana nasil atacağımı bilmiyorum",
            "umarim atabilmisimdir",
            "Benden yana kararın ne olursa olsun seni cevap vermeye zorlamak istemiyorum",

            "Konuşmak zorunda değilsin.",

        let aktifMesajIndex = 0;
        const metinAlani = document.getElementById('metin-alani');
        const baslangicEkrani = document.getElementById('baslangic-ekrani');
        const okumaEkrani = document.getElementById('okuma-ekrani');
        const finalEkrani = document.getElementById('final-ekrani');

        document.getElementById('btn-ileri').addEventListener('click', function() {
            baslangicEkrani.classList.add('gizli'); 
            okumaEkrani.classList.remove('gizli'); 
            metinAlani.innerHTML = mesajlar[aktifMesajIndex]; 
            
            let muzik = document.getElementById('bg-muzik');
            if (muzik) {
                muzik.volume = 0.02; 
                muzik.play().catch(e => console.log("Otomatik oynatma engellendi"));
            }
        });

        // İlk ekranda "Sadece Çık" derse
        document.getElementById('btn-cik').addEventListener('click', function() {
            document.body.innerHTML = '<div style="height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; background-color:#000; color:#444; font-size:1rem; font-style:italic;"><span style="margin-bottom:10px;">Hoşça kal...</span><span style="font-size:0.7rem;">(Sekmeyi kapatabilirsin)</span></div>';
        });

        // En son ekranda "Şu an hazır değilim" derse
        document.getElementById('btn-final-cik').addEventListener('click', function() {
            document.body.innerHTML = '<div style="height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; background-color:#000; color:#ddd; font-size:1.1rem; font-style:italic; text-align:center;"><span style="margin-bottom:15px;">Yine de her şey için teşekkür ederim...</span><span style="font-size:0.8rem; color:#666;">(Sekmeyi kapatabilirsin)</span></div>';

        okumaEkrani.addEventListener('click', function(e) {

            if (aktifMesajIndex < mesajlar.length - 1) {
                aktifMesajIndex++;
                
                metinAlani.style.opacity = 0;
                setTimeout(() => {
                    metinAlani.innerHTML = mesajlar[aktifMesajIndex];
                    metinAlani.style.opacity = 1;
                }, 300); 
            } else {
                document.querySelector('.dokun-uyari').style.display = 'none';
                finalEkrani.classList.remove('gizli');

        });

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Süre Doldu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            color: #d1d1d1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            background-color: #050505; 
        }

        .video-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
            pointer-events: none; 
        }

        .video-wrapper iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw; 
            min-height: 100vh;
            min-width: 177.77vh; 
            transform: translate(-50%, -50%) scale(1.3); 
            pointer-events: none;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75); 
            z-index: 0;
        }

        /* Eski siteye gönderme: Sol üstteki silik ve soğuk anı */
        .eski-ani {
            position: absolute;
            top: 20px;
            left: 20px;
            text-align: left;
            font-size: 0.8rem;
            color: #ffffff;
            opacity: 0.4; 
            z-index: 2;
            pointer-events: none;
            line-height: 1.4;
            font-style: italic;
        }
        
        .eski-ani-derece {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 3px;
            display: block;
        }

        .container {
            position: relative;
            z-index: 1; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 35px 20px;
            border-radius: 12px;
            background-color: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(8px); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            width: 85%;
            max-width: 380px; 
        }

        .eski-baslik {
            font-size: 0.9rem;
            color: #777;
            text-decoration: line-through;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        
        h1 {
            font-size: 1.3rem;
            color: #ff4c4c;
            margin-bottom: 15px;
            font-weight: normal;
            letter-spacing: 1px;
            margin-top: 0;
        }
        
        #sayac {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 30px;
            color: #ffffff;
            line-height: 1.4;
        }
        
        .whatsapp-link {
            color: #888;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.3s;
            display: block;
            margin-top: 15px;
            padding: 12px 10px;
            border-radius: 6px;
            background: rgba(255,255,255,0.03); 
        }
        
        .whatsapp-link:hover {
            color: #fff;
            background: rgba(255,255,255,0.08);
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <iframe src="https://www.youtube.com/embed/qk_aNQJG_g8?autoplay=1&mute=1&loop=1&playlist=qk_aNQJG_g8&controls=0&showinfo=0&autohide=1&rel=0&modestbranding=1" 
                frameborder="0" 
                allow="autoplay; encrypted-media" 
                allowfullscreen>
        </iframe>
    </div>
    
    <div class="overlay"></div>

    <div class="eski-ani">
        <span class="eski-ani-derece">❄️ 0°C</span>
        sen gittiğinden beri...
    </div>

    <div class="container">
        <div class="eski-baslik">sonsuzluğa akan sayaç...</div>
        <h1>Prensesinden Ayrı Düşeli...</h1>
        <div id="sayac">Yükleniyor...</div>
        
        <a href="https://wa.me/905518780853" class="whatsapp-link">Eski siteyi mi istiyorsunuz?<br>Sadece buna tıkla...</a>
    </div>

    <script>
        const ayrilikTarihi = new Date(2026, 7, 16, 11, 30, 0).getTime();

        const sayacGuncelle = setInterval(function() {
            const suAn = new Date().getTime();
            const fark = suAn - ayrilikTarihi;

            if (fark < 0) {
                document.getElementById("sayac").innerHTML = "0 Gün<br><span style='font-size: 1.2rem; color: #bbb;'>0 Saat 0 Dk 0 Sn</span>";
                return;
            }

            const gun = Math.floor(fark / (1000 * 60 * 60 * 24));
            const saat = Math.floor((fark % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const dakika = Math.floor((fark % (1000 * 60 * 60)) / (1000 * 60));
            const saniye = Math.floor((fark % (1000 * 60)) / 1000);

            document.getElementById("sayac").innerHTML = gun + " Gün<br><span style='font-size: 1.2rem; color: #bbb;'>" + saat + " Saat " + dakika + " Dk " + saniye + " Sn</span>";

        }, 1000);
    </script>

</body>
</html>
